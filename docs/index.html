<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docsify サンプル</title>
  <meta name="description" content="Docsifyで作った日本語のドキュメントサンプルです。">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Docsify サンプル',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
